# Run only through scripts/test-stage9-fixture-e2e.ps1. This project uses
# random Compose names, loopback ports and its own volumes; it never contacts
# Instagram or shares Stage 8/Collector-smoke/production state.
services:
  postgres:
    image: postgres:17.10-alpine3.23
    environment: { POSTGRES_DB: stage9, POSTGRES_USER: stage9, POSTGRES_PASSWORD: "${STAGE9_POSTGRES_PASSWORD:?required}" }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 2s, timeout: 2s, retries: 30 }
    volumes: [stage9_postgres:/var/lib/postgresql/data]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: ["server", "/data"]
    environment: { MINIO_ROOT_USER: stage9root, MINIO_ROOT_PASSWORD: "${STAGE9_MINIO_PASSWORD:?required}" }
    healthcheck: { test: ["CMD-SHELL", "mc ready local"], interval: 2s, timeout: 2s, retries: 30 }
    volumes: [stage9_minio:/data]
  redis:
    image: redis:7.4.7-alpine3.21
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 2s, retries: 30 }
  migrate:
    build: { context: ../apps/api, target: production }
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment: &fixture_env
      DATABASE_URL: postgresql+psycopg://stage9:${STAGE9_POSTGRES_PASSWORD}@postgres:5432/stage9
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: stage9
      MINIO_ACCESS_KEY: stage9root
      MINIO_SECRET_KEY: ${STAGE9_MINIO_PASSWORD}
      VIDEO_CURSOR_SECRET: ${STAGE9_VIDEO_CURSOR_SECRET:?required}
      FRONTEND_ORIGIN: "${STAGE9_PUBLIC_ORIGIN:?required}"
      MANAGEMENT_ORIGIN: "${STAGE9_PUBLIC_ORIGIN:?required}"
      LOGIN_GATEWAY_ORIGIN: "${STAGE9_PUBLIC_ORIGIN:?required}"
      STAGE9_FIXTURE_PAIRING_SECRET: ${STAGE9_FIXTURE_PAIRING_SECRET:?required}
      STAGE9_FIXTURE_SECOND_PAIRING_SECRET: ${STAGE9_FIXTURE_SECOND_PAIRING_SECRET:?required}
    depends_on: { postgres: { condition: service_healthy } }
  bootstrap:
    build: { context: ../apps/api, target: production }
    command: ["uv", "run", "--no-sync", "python", "-m", "app.scripts.stage9_fixture_runtime"]
    environment: { <<: *fixture_env, STAGE9_FIXTURE_MODE: bootstrap }
    depends_on: { migrate: { condition: service_completed_successfully } }
  api:
    build: { context: ../apps/api, target: production }
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *fixture_env
    depends_on: { bootstrap: { condition: service_completed_successfully }, minio: { condition: service_healthy }, redis: { condition: service_healthy } }
  login-gateway:
    build: { context: ../apps/api, target: production }
    command: ["uv", "run", "--no-sync", "uvicorn", "app.scripts.stage9_fixture_runtime:gateway", "--factory", "--host", "0.0.0.0", "--port", "8080"]
    environment: *fixture_env
    depends_on: { bootstrap: { condition: service_completed_successfully } }
  collector-fixture:
    build: { context: ../apps/api, target: production }
    command: ["uv", "run", "--no-sync", "python", "-m", "app.scripts.stage9_fixture_runtime"]
    environment: { <<: *fixture_env, STAGE9_FIXTURE_MODE: collector }
    depends_on: { bootstrap: { condition: service_completed_successfully } }
  normalizer-fixture:
    build: { context: ../apps/api, target: production }
    command: ["uv", "run", "--no-sync", "python", "-m", "app.scripts.stage9_fixture_runtime"]
    environment: { <<: *fixture_env, STAGE9_FIXTURE_MODE: normalizer }
    depends_on: { bootstrap: { condition: service_completed_successfully }, minio: { condition: service_healthy } }
  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: "${STAGE9_PUBLIC_ORIGIN:?required}/api"
        NEXT_PUBLIC_STAGE9_FIXTURE_MODE: "true"
    depends_on: { api: { condition: service_started } }
  caddy:
    image: caddy:2.10.2-alpine
    ports: ["127.0.0.1:${STAGE9_PORT}:443"]
    environment: { STAGE9_CADDY_FUNNEL_HOST: "${STAGE9_CADDY_FUNNEL_HOST:-stage9-funnel.invalid}" }
    volumes: ["./Caddyfile.stage9-fixture:/etc/caddy/Caddyfile:ro"]
    depends_on: { web: { condition: service_started }, login-gateway: { condition: service_started } }
volumes:
  stage9_postgres: {}
  stage9_minio: {}
