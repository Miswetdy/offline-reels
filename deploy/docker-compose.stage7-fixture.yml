name: offline-reels-stage7-fixture
services:
  postgres:
    image: postgres:17.10-alpine3.23
    environment: { POSTGRES_DB: stage7, POSTGRES_USER: stage7, POSTGRES_PASSWORD: "${STAGE7_POSTGRES_PASSWORD:?required}" }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 2s, timeout: 2s, retries: 30 }
    volumes: [stage7_postgres:/var/lib/postgresql/data]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: ["server", "/data"]
    environment: { MINIO_ROOT_USER: stage7root, MINIO_ROOT_PASSWORD: "${STAGE7_MINIO_PASSWORD:?required}" }
    healthcheck: { test: ["CMD-SHELL", "mc ready local"], interval: 2s, timeout: 2s, retries: 30 }
    volumes: [stage7_minio:/data]
  redis:
    image: redis:7.4.7-alpine3.21
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 2s, retries: 30 }
  migrate:
    build: { context: ../apps/api, target: production }
    command: ["uv","run","--no-sync","alembic","upgrade","head"]
    environment: &api_env
      DATABASE_URL: postgresql+psycopg://stage7:${STAGE7_POSTGRES_PASSWORD}@postgres:5432/stage7
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: stage7
      MINIO_ACCESS_KEY: stage7root
      MINIO_SECRET_KEY: ${STAGE7_MINIO_PASSWORD}
      VIDEO_CURSOR_SECRET: ${STAGE7_VIDEO_CURSOR_SECRET:?required}
      # The browser-facing fixture origin and host bind port are separate:
      # manual acceptance uses its random loopback URL, whereas container E2E
      # resolves https://localhost directly to Caddy. Both remain exact,
      # explicit origins; neither broadens the Stage 6 Host/Origin checks.
      FRONTEND_ORIGIN: "${STAGE7_PUBLIC_ORIGIN:?required}"
      MANAGEMENT_ORIGIN: "${STAGE7_PUBLIC_ORIGIN:?required}"
      LOGIN_GATEWAY_ORIGIN: "${STAGE7_PUBLIC_ORIGIN:?required}"
      STAGE7_FIXTURE_PAIRING_SECRET: ${STAGE7_FIXTURE_PAIRING_SECRET:?required}
    depends_on: { postgres: { condition: service_healthy } }
  bootstrap:
    build: { context: ../apps/api, target: production }
    command: ["uv","run","--no-sync","python","-m","app.scripts.stage7_fixture_runtime"]
    environment: { <<: *api_env, STAGE7_FIXTURE_MODE: bootstrap }
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
  api:
    build: { context: ../apps/api, target: production }
    command: ["uv","run","--no-sync","uvicorn","app.main:app","--host","0.0.0.0","--port","8000"]
    environment: *api_env
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }
  login-gateway:
    build: { context: ../apps/api, target: production }
    command: ["uv","run","--no-sync","uvicorn","app.scripts.stage7_fixture_runtime:gateway","--factory","--host","0.0.0.0","--port","8080"]
    environment: *api_env
    depends_on: { bootstrap: { condition: service_completed_successfully } }
  collector-fixture:
    build: { context: ../apps/api, target: production }
    command: ["uv","run","--no-sync","python","-m","app.scripts.stage7_fixture_runtime"]
    environment:
      <<: *api_env
      STAGE7_FIXTURE_MODE: collector
      # The E2E cancellation branch must own a run before it can complete.
      STAGE7_FIXTURE_COLLECTOR_DELAY: "4"
    depends_on: { bootstrap: { condition: service_completed_successfully } }
  normalizer-fixture:
    build: { context: ../apps/api, target: production }
    command: ["uv","run","--no-sync","python","-m","app.scripts.stage7_fixture_runtime"]
    environment: { <<: *api_env, STAGE7_FIXTURE_MODE: normalizer }
    depends_on: { bootstrap: { condition: service_completed_successfully }, minio: { condition: service_healthy } }
  web:
    # The existing media catalog client is configured at build time. Keep it
    # on exactly the same public origin as the protected management client.
    build: { context: ../apps/web, args: { NEXT_PUBLIC_API_BASE_URL: "${STAGE7_PUBLIC_ORIGIN:?required}/api" } }
    depends_on: { api: { condition: service_started } }
  caddy:
    image: caddy:2.10.2-alpine
    ports: ["127.0.0.1:${STAGE7_PORT}:443"]
    environment: { STAGE7_PORT: "${STAGE7_PORT}" }
    volumes: ["./Caddyfile.stage7-fixture:/etc/caddy/Caddyfile:ro"]
    depends_on: { web: { condition: service_started }, login-gateway: { condition: service_started } }
  e2e:
    build: { context: ../apps/api, target: collector }
    # The fixture deliberately reuses the Chromium layer, but it is not a
    # Collector invocation.  Do not route this synthetic UI test through the
    # production Collector entrypoint.
    entrypoint: []
    command: ["uv","run","--no-sync","python","-m","app.scripts.stage7_fixture_e2e"]
    environment: { <<: *api_env }
    depends_on: { caddy: { condition: service_started } }
    profiles: [e2e]
volumes: { stage7_postgres: {}, stage7_minio: {} }
