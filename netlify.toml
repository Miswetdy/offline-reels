# This file belongs at the repository root so its base directory overrides any
# stale monorepo settings saved in the Netlify UI.
[build]
  base = "apps/web"
  command = "npm ci && npm run build"

[build.environment]
  NODE_VERSION = "24.14.0"

# Set NEXT_PUBLIC_API_BASE_URL in Netlify Project configuration > Environment
# variables before each build. It is a public browser-facing Backend API URL;
# do not put credentials, tokens, or any other secret in it.
#
# Modern Netlify Next.js support uses its OpenNext adapter automatically. Do
# not add or pin the legacy @netlify/plugin-nextjs plugin here.
# Keep publish unset so framework detection owns the Next.js output and route
# function generation instead of treating a raw .next directory as a static
# deploy target.
