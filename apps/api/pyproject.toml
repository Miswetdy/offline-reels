[project]
name = "offline-reels-api"
version = "0.1.0"
description = "Backend bootstrap for Offline Reels"
requires-python = "==3.14.*"
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.139.2",
    "minio==7.2.20",
    "psycopg[binary]==3.3.2",
    "pydantic-settings==2.13.1",
    "redis==7.2.0",
    "sqlalchemy==2.0.51",
    "uvicorn[standard]==0.40.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.2",
    "ruff==0.14.14",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
